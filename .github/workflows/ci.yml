name: CI/CD Pipeline

# Practical 12: Continuous Integration with GitHub Actions
# Triggers automated tests on every push and pull request to the main branch

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend API Tests
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      JWT_SECRET: practical12_ci_test_secret_key

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install backend dependencies
        working-directory: ./server
        run: npm ci

      - name: Run automated Jest & Supertest tests
        working-directory: ./server
        run: npm test
